<!DOCTYPE html>
<html>
<head>
    <title>Food menu</title>
    <style>
        body {
            background-color: #F8F5F0;
            color: #2c2c2c;
        }

        #fd {
            color: #D35400;
        }

        #dr {
            color: #16A085;
        }

        #ds {
            color: pink;
        }

        button{
            background-color:#E67E22;
            color:white;
            border: #d0d0d0;
        }
    </style>
</head>
<body>
    <style>

    </style>
    <form>
        <p id="fd">Choose your food:</p>
        <input type="radio" id="poutine" name="food" value="poutine">
        <label for="poutine">Poutine</label>
        <br>
        <input type="radio" id="pizza" name="food" value="pizza">
        <label for="pizza">Pizza</label>
        <br>
        <input type="radio" id="hamburger" name="food" value="hamburger">
        <label for="hamburger">Hamburger</label>

        <p id="dr">Choose your drink:</p>
        <input type="checkbox" id="beer" name="drink" value="beer">
        <label for="beer">Beer</label>
        <br>
        <input type="checkbox" id="coke" name="drink" value="coke">
        <label for="coke">Coke</label>
        <br>
        <input type="checkbox" id="juice" name="drink" value="juice">
        <label for="juice">Juice</label>

        <p id="ds">Dessert:
        <select name="dessert">
            <option value="no dessert">No dessert</option>
            <option value="ice cream">Ice cream</option>
            <option value="trifle">Trifle</option>
            <option value="tiramisu">Tiramisu</option>
        </select>
        </p>
        <br>

        <button type="submit">Command</button>
        <button type="reset">Clear</button>
    </form>
</body>
</html>
